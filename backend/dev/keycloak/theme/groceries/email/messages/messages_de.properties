passwordResetSubject=Passwort zurücksetzen
passwordResetBody=Für dein Konto bei Einkaufsliste wurde ein neues Passwort angefordert. Öffne den folgenden Link, um ein neues Passwort festzulegen:\n\n{0}\n\nDer Link ist {1} Minuten gültig und kann nur einmal verwendet werden.\n\nWenn du das nicht angefordert hast, kannst du diese E-Mail ignorieren. Dein Passwort bleibt dann unverändert.
passwordResetBodyHtml=<p>Für dein Konto bei Einkaufsliste wurde ein neues Passwort angefordert. Öffne den folgenden Link, um ein neues Passwort festzulegen:</p><p><a href="{0}">Neues Passwort festlegen</a></p><p>Der Link ist {1} Minuten gültig und kann nur einmal verwendet werden.</p><p>Wenn du das nicht angefordert hast, kannst du diese E-Mail ignorieren. Dein Passwort bleibt dann unverändert.</p>
