<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Konzept C – Fokus und Eingabe zuerst</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="height: {{rootH}}; width: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; box-sizing: border-box; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}; color-scheme: {{theme}}">

  <header style="flex-shrink: 0; border-bottom: 1px solid {{t.border}}">
    <div style="max-width: {{maxW}}; margin: 0 auto; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: {{hdrPad}}">
      <h1 style="flex: 1; min-width: 0; margin: 0; font-size: inherit">
        <button type="button" aria-expanded="{{switcherExpanded}}" onClick="{{toggleSwitcher}}" style="max-width: 100%; min-height: 56px; display: inline-flex; align-items: center; gap: 8px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; text-align: left; cursor: pointer">
          <span style="min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 14px; font-weight: 400; color: {{t.muted}}">Liste</span>
            <span style="font-size: {{titleSize}}; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{active.name}}</span>
          </span>
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </h1>
      <sc-if value="{{wide}}" hint-placeholder-val="{{ true }}">
        <button type="button" style="height: 48px; display: inline-flex; align-items: center; gap: 8px; padding: 0 18px; border: 2px solid {{t.text}}; border-radius: 999px; background: transparent; color: {{t.text}}; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>
          Teilen
        </button>
      </sc-if>
      <sc-if value="{{mobile}}" hint-placeholder-val="{{ false }}">
        <button type="button" aria-label="Liste teilen" style="width: 48px; height: 48px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; color: {{t.text}}; cursor: pointer">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>
        </button>
      </sc-if>
      <button type="button" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}" style="width: 48px; height: 48px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; color: {{t.text}}; cursor: pointer">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
        </sc-if>
      </button>
      <button type="button" aria-label="Menü" aria-expanded="{{menuExpanded}}" onClick="{{toggleMenu}}" style="width: 48px; height: 48px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: {{menuBtnBg}}; color: {{t.text}}; cursor: pointer">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto">
    <div style="max-width: {{maxW}}; margin: 0 auto; box-sizing: border-box; padding: {{contentPad}}; display: flex; flex-direction: column; gap: 28px">

      <form onSubmit="{{onAdd}}" style="display: flex; flex-direction: column; gap: 10px">
        <label for="add-c" style="font-size: {{labelSize}}; font-weight: 700">Was fehlt?</label>
        <div style="display: flex; gap: 10px">
          <input id="add-c" type="text" autocomplete="off" value="{{draft}}" onChange="{{onDraft}}" placeholder="z. B. 2× Milch, laktosefrei" style="flex: 1; min-width: 0; height: 60px; box-sizing: border-box; padding: 0 18px; font: inherit; font-size: 20px; border: 2px solid {{t.control}}; border-radius: 14px; background: {{t.field}}; color: {{t.text}}">
          <button type="submit" style="height: 60px; flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; padding: {{addBtnPad}}; border: 0; border-radius: 14px; background: {{t.accent}}; color: {{t.accentText}}; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            <sc-if value="{{wide}}" hint-placeholder-val="{{ true }}"><span>Hinzufügen</span></sc-if>
            <sc-if value="{{mobile}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Hinzufügen</span></sc-if>
          </button>
        </div>
      </form>

      <div>
        <p style="margin: 0 0 10px; font-size: 18px"><strong>{{doneCount}} von {{total}}</strong> erledigt</p>
        <div aria-hidden="true" style="height: 12px; border-radius: 999px; background: {{t.track}}; overflow: hidden">
          <div style="height: 100%; width: {{pct}}; border-radius: 999px; background: {{t.accent}}"></div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: {{gridCols}}; gap: 40px; align-items: start">
        <section aria-labelledby="open-c" style="display: flex; flex-direction: column; gap: 8px">
          <h2 id="open-c" style="margin: 0; font-size: 22px; font-weight: 700">Noch zu kaufen ({{openCount}})</h2>
          <sc-if value="{{noOpen}}" hint-placeholder-val="{{ false }}">
            <p style="margin: 0; font-size: 20px; color: {{t.muted}}">Alles im Wagen.</p>
          </sc-if>
          <ul style="list-style: none; margin: 0; padding: 0">
            <sc-for list="{{openItems}}" as="it" hint-placeholder-count="7">
              <li style="border-bottom: 1px solid {{t.border}}">
                <label style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 6px 4px; cursor: pointer; font-size: {{itemSize}}">
                  <input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="width: 28px; height: 28px; margin: 0; flex-shrink: 0; accent-color: {{t.accent}}">
                  <span>{{it.text}}</span>
                </label>
              </li>
            </sc-for>
          </ul>
        </section>

        <sc-if value="{{wide}}" hint-placeholder-val="{{ true }}">
          <section aria-labelledby="done-c" style="display: flex; flex-direction: column; gap: 8px; padding: 20px 24px; border-radius: 20px; background: {{t.panel}}">
            <h2 id="done-c" style="margin: 0; font-size: 22px; font-weight: 700">Im Wagen ({{doneCount}})</h2>
            <ul style="list-style: none; margin: 0; padding: 0">
              <sc-for list="{{doneItems}}" as="it" hint-placeholder-count="2">
                <li style="border-bottom: 1px solid {{t.border}}">
                  <label style="display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 4px; cursor: pointer; font-size: 19px; color: {{t.muted}}">
                    <input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: {{t.accent}}">
                    <span style="text-decoration: line-through">{{it.text}}</span>
                  </label>
                </li>
              </sc-for>
            </ul>
            <sc-if value="{{hasDone}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{onClear}}" style="align-self: flex-start; margin-top: 8px; min-height: 48px; padding: 0 18px; border: 2px solid {{t.text}}; border-radius: 999px; background: transparent; color: {{t.text}}; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Erledigte entfernen</button>
            </sc-if>
          </section>
        </sc-if>

        <sc-if value="{{mobile}}" hint-placeholder-val="{{ false }}">
          <details style="border-radius: 16px; background: {{t.panel}}; padding: 0 16px">
            <summary style="min-height: 56px; display: flex; align-items: center; font-size: 20px; font-weight: 700; cursor: pointer">Im Wagen ({{doneCount}}) – anzeigen</summary>
            <ul style="list-style: none; margin: 0; padding: 0">
              <sc-for list="{{doneItems}}" as="it" hint-placeholder-count="2">
                <li style="border-top: 1px solid {{t.border}}">
                  <label style="display: flex; align-items: center; gap: 16px; min-height: 56px; cursor: pointer; font-size: 19px; color: {{t.muted}}">
                    <input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: {{t.accent}}">
                    <span style="text-decoration: line-through">{{it.text}}</span>
                  </label>
                </li>
              </sc-for>
            </ul>
            <sc-if value="{{hasDone}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{onClear}}" style="margin: 8px 0 16px; min-height: 48px; padding: 0 18px; border: 2px solid {{t.text}}; border-radius: 999px; background: transparent; color: {{t.text}}; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Erledigte entfernen</button>
            </sc-if>
          </details>
        </sc-if>
      </div>
    </div>
  </div>

  <sc-if value="{{switcherOpen}}" hint-placeholder-val="{{ false }}">
    <button type="button" tabindex="-1" aria-hidden="true" onClick="{{closeSwitcher}}" style="position: absolute; inset: 0; z-index: 9; border: 0; padding: 0; background: rgba(0,0,0,0.5); cursor: pointer"></button>
    <div style="position: absolute; z-index: 10; top: {{popTop}}; left: {{popLeft}}; width: 340px; max-width: calc(100% - 32px); box-sizing: border-box; padding: 12px; border-radius: 20px; background: {{t.field}}; border: 1px solid {{t.border}}; box-shadow: 0 16px 48px rgba(0,0,0,0.35)">
      <h2 style="margin: 4px 8px 8px; font-size: 16px; font-weight: 700; color: {{t.muted}}">Meine Listen</h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
        <sc-for list="{{lists}}" as="l" hint-placeholder-count="3">
          <li>
            <button type="button" onClick="{{l.pick}}" aria-current="{{l.current}}" style="width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 12px; background: {{l.bg}}; color: {{t.text}}; font: inherit; font-size: 19px; font-weight: {{l.fw}}; text-align: left; cursor: pointer">
              <span aria-hidden="true" style="width: 24px; display: inline-flex; color: {{t.accentInk}}">
                <sc-if value="{{l.isCurrent}}" hint-placeholder-val="{{ false }}">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
                </sc-if>
              </span>
              <span style="flex: 1">{{l.name}}</span>
              <span style="font-size: 16px; color: {{t.muted}}">{{l.openText}}</span>
            </button>
          </li>
        </sc-for>
      </ul>
      <button type="button" style="width: 100%; margin-top: 8px; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 2px dashed {{t.control}}; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        Neue Liste
      </button>
    </div>
  </sc-if>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <button type="button" tabindex="-1" aria-hidden="true" onClick="{{closeMenu}}" style="position: absolute; inset: 0; z-index: 9; border: 0; padding: 0; background: rgba(0,0,0,0.5); cursor: pointer"></button>
    <nav aria-label="Menü" style="position: absolute; z-index: 10; top: {{popTop}}; right: {{popRight}}; width: 320px; max-width: calc(100% - 32px); box-sizing: border-box; padding: 12px; border-radius: 20px; background: {{t.field}}; border: 1px solid {{t.border}}; box-shadow: 0 16px 48px rgba(0,0,0,0.35)">
      <h2 style="margin: 4px 8px 8px; font-size: 16px; font-weight: 700; color: {{t.muted}}">Diese Liste</h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
        <li>
          <button type="button" style="width: 100%; min-height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; font-size: 19px; text-align: left; cursor: pointer">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
            Umbenennen
          </button>
        </li>
        <li>
          <button type="button" style="width: 100%; min-height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; font-size: 19px; text-align: left; cursor: pointer">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>
            Teilen-Link erneuern
          </button>
        </li>
        <li>
          <button type="button" style="width: 100%; min-height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; font-size: 19px; text-align: left; cursor: pointer">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
            Liste verlassen
          </button>
        </li>
        <li>
          <button type="button" style="width: 100%; min-height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: {{t.danger}}; font: inherit; font-size: 19px; font-weight: 700; text-align: left; cursor: pointer">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
            Liste löschen
          </button>
        </li>
      </ul>
      <div aria-hidden="true" style="height: 1px; margin: 8px 4px; background: {{t.border}}"></div>
      <h2 style="margin: 4px 8px 8px; font-size: 16px; font-weight: 700; color: {{t.muted}}">Konto</h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
        <li>
          <button type="button" style="width: 100%; min-height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; font-size: 19px; text-align: left; cursor: pointer">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
            Einstellungen
          </button>
        </li>
        <li>
          <button type="button" style="width: 100%; min-height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; font-size: 19px; text-align: left; cursor: pointer">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="M10 17l-5-5 5-5"></path><path d="M5 12h12"></path></svg>
            Abmelden
          </button>
        </li>
      </ul>
    </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"device":{"editor":"enum","options":["auto","mobile","tablet","desktop"],"default":"auto"},"switcher":{"editor":"boolean","default":false},"menu":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this._onResize);
    this._onResize();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
  }
  seed() {
    const raw = [
      ['woche', 'Wocheneinkauf', [['2× Milch, laktosefrei', 0], ['Vollkornbrot', 0], ['6 Eier', 0], ['Tomaten', 0], ['Bananen', 0], ['Kaffeebohnen 500 g', 0], ['Spülmittel', 0], ['Butter', 1], ['Naturjoghurt', 1]]],
      ['grill', 'Grillabend Samstag', [['Grillkohle', 0], ['Halloumi', 0], ['4 Maiskolben', 0], ['Kräuterbaguette', 0], ['Senf', 1]]],
      ['wg', 'WG-Vorrat', [['Toilettenpapier', 0], ['Reis 1 kg', 0], ['Haferflocken', 1]]]
    ];
    return raw.map(([id, name, items]) => ({ id, name, items: items.map(([text, d], i) => ({ id: id + '-' + i, text, done: !!d })) }));
  }
  renderVals() {
    const s = this.state || {};
    const lists = s.lists || this.seed();
    const theme = s.theme || this.props.theme || 'light';
    const vw = s.vw || 1280;
    const pd = this.props.device;
    const device = pd && pd !== 'auto' ? pd : (vw < 700 ? 'mobile' : vw < 1100 ? 'tablet' : 'desktop');
    const mobile = device === 'mobile';
    const T = {
      light: { bg: '#FFFFFF', field: '#FFFFFF', panel: '#F5F5F4', text: '#111111', muted: '#4B5563', border: '#E5E7EB', control: '#6B7280', accent: '#1D4ED8', accentText: '#FFFFFF', accentInk: '#1D4ED8', track: '#E5E7EB', currentBg: '#DBEAFE', danger: '#B91C1C', hover: '#F3F4F6' },
      dark: { bg: '#0A0A0A', field: '#171717', panel: '#171717', text: '#F5F5F5', muted: '#A3A3A3', border: '#262626', control: '#A3A3A3', accent: '#93C5FD', accentText: '#0A0A0A', accentInk: '#93C5FD', track: '#262626', currentBg: '#1E3A8A', danger: '#FCA5A5', hover: '#262626' }
    };
    const t = T[theme] || T.light;
    const activeId = s.active || 'woche';
    const active = lists.find((l) => l.id === activeId) || lists[0];
    const setActiveItems = (fn) => this.setState({ lists: lists.map((l) => (l.id === active.id ? { ...l, items: fn(l.items) } : l)) });
    const toggle = (id) => setActiveItems((items) => items.map((it) => (it.id === id ? { ...it, done: !it.done } : it)));
    const open = active.items.filter((i) => !i.done);
    const done = active.items.filter((i) => i.done);
    const total = active.items.length;
    const mapItem = (it) => ({ ...it, toggle: () => toggle(it.id) });
    const switcherOpen = s.switcher !== undefined ? s.switcher : !!this.props.switcher;
    const menuOpen = !switcherOpen && (s.menu !== undefined ? s.menu : !!this.props.menu);
    const fixedH = { mobile: '844px', tablet: '1112px', desktop: '800px' };
    return {
      t,
      theme,
      isDark: theme === 'dark',
      isLight: theme !== 'dark',
      themeLabel: theme === 'dark' ? 'Helles Design aktivieren' : 'Dunkles Design aktivieren',
      toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' }),
      rootH: pd && pd !== 'auto' ? fixedH[pd] : '100vh',
      mobile,
      wide: !mobile,
      maxW: device === 'desktop' ? '1040px' : device === 'tablet' ? '760px' : '100%',
      hdrPad: mobile ? '10px 8px 10px 8px' : '14px 24px',
      contentPad: mobile ? '20px 16px 40px' : '32px 24px 48px',
      titleSize: mobile ? '24px' : '30px',
      labelSize: mobile ? '20px' : '22px',
      itemSize: mobile ? '20px' : '22px',
      addBtnPad: mobile ? '0 18px' : '0 24px',
      gridCols: mobile ? 'minmax(0, 1fr)' : 'minmax(0, 3fr) minmax(0, 2fr)',
      active,
      total,
      openCount: open.length,
      doneCount: done.length,
      pct: total ? Math.round((done.length / total) * 100) + '%' : '0%',
      noOpen: open.length === 0,
      hasDone: done.length > 0,
      openItems: open.map(mapItem),
      doneItems: done.map(mapItem),
      onClear: () => setActiveItems((items) => items.filter((i) => !i.done)),
      draft: s.draft || '',
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onAdd: (e) => {
        e.preventDefault();
        const v = (s.draft || '').trim();
        if (!v) return;
        this.setState({ draft: '', lists: lists.map((l) => (l.id === active.id ? { ...l, items: [...l.items, { id: l.id + '-' + Date.now(), text: v, done: false }] } : l)) });
      },
      switcherOpen,
      switcherExpanded: switcherOpen ? 'true' : 'false',
      toggleSwitcher: () => this.setState({ switcher: !switcherOpen, menu: false }),
      menuOpen,
      menuExpanded: menuOpen ? 'true' : 'false',
      menuBtnBg: menuOpen ? t.hover : 'transparent',
      toggleMenu: () => this.setState({ menu: !menuOpen, switcher: false }),
      closeMenu: () => this.setState({ menu: false }),
      popRight: mobile ? '16px' : 'max(24px, calc((100% - ' + (device === 'desktop' ? '1040px' : '760px') + ') / 2 + 24px))',
      closeSwitcher: () => this.setState({ switcher: false }),
      popTop: mobile ? '80px' : '88px',
      popLeft: mobile ? '16px' : 'max(24px, calc((100% - ' + (device === 'desktop' ? '1040px' : '760px') + ') / 2 + 24px))',
      lists: lists.map((l) => {
        const cur = l.id === active.id;
        const oc = l.items.filter((i) => !i.done).length;
        return {
          ...l,
          isCurrent: cur,
          current: cur ? 'page' : 'false',
          bg: cur ? t.currentBg : 'transparent',
          fw: cur ? '700' : '400',
          openText: oc + ' offen',
          pick: () => this.setState({ active: l.id, switcher: false })
        };
      })
    };
  }
}
</script>
</body>
</html>
