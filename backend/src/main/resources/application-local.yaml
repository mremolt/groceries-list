# src/main/resources/application-local.yaml (SPRING-DEV-02/03)
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local  (IDE: active profile `local`)
# Boot starts compose.yaml automatically because spring-boot-docker-compose is on the runtime classpath.
# That module is left out of the repackaged jar and disabled in tests by default.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/groceries?connectTimeout=2&socketTimeout=10
    username: groceries
    password: groceries
  flyway:
    placeholders:
      app-role: groceries
  docker:
    compose:
      # lifecycle-management: start-only   # keep Postgres/Kafka running after the app stops
      # profiles:
      #   active: tools,auth                 # optional Compose profiles, see compose.yaml

server:
  servlet:
    session:
      cookie:
        name: SESSION                 # http://localhost cannot carry a Secure or __Host- cookie (documented in docs/security/requirements.md)
        secure: false

app:
  auth:
    issuer-uri: http://keycloak.localhost:8180/realms/groceries
    client-secret: dev-only-client-secret   # dev realm value, fictitious (docs/security/requirements.md)
  idp-admin:
    client-secret: dev-only-admin-secret    # service account that deletes accounts at the IdP, dev realm value, fictitious
  sharing:
    public-base-url: http://localhost:4200   # the Angular dev server, where people open /j/<token> locally
  frontend:
    bundle-enabled: false            # the Angular dev server serves the SPA and proxies to this backend (REL-FE-02)

springdoc:
  api-docs:
    enabled: true                     # local only; deployed it stays off (SPRING-API-10)
