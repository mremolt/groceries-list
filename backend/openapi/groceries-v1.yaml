openapi: 3.1.0
info:
  title: Groceries list API
  version: v1
servers:
- url: /
paths:
  /api/v1/invitations:
    post:
      operationId: rememberInvitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareTokenRequest"
        required: true
      responses:
        "204":
          description: The link is valid and remembered in the server-side session
            until the login has finished
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unknown or renewed link; code SHARE_LINK_INVALID, the same\
            \ answer for both"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many requests; code RATE_LIMITED
      summary: Public. Remembers the share token in the session before the login (FR-AUTH-06)
      tags:
      - sharing
  /api/v1/invitations/lookup:
    post:
      operationId: lookupInvitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
          description: "The name of the list behind the link, nothing else"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unknown or renewed link; code SHARE_LINK_INVALID, the same\
            \ answer for both"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many requests; code RATE_LIMITED
      summary: "Public. The list name for the invitation banner (FR-AUTH-06 AC1, AC4)"
      tags:
      - sharing
  /api/v1/lists:
    get:
      operationId: listMyLists
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyListsResponse"
          description: "The lists, possibly none"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
      summary: "The lists of the logged-in person, at most 100, oldest membership\
        \ first"
      tags:
      - lists
    post:
      operationId: createList
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
          description: The new list; Location points to it
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid name; code VALIDATION_FAILED with errors[].code NAME_REQUIRED\
            \ or NAME_TOO_LONG"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 100 lists reached (BR-12); code LIST_LIMIT_REACHED
      summary: Create a list; the caller becomes its only member
      tags:
      - lists
  /api/v1/lists/{listId}:
    delete:
      operationId: deleteList
      parameters:
      - in: path
        name: listId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such list or no member; code LIST_NOT_FOUND, the same answer\
            \ for both"
      summary: Delete a list with its items and memberships for all members
      tags:
      - lists
    get:
      operationId: getList
      parameters:
      - in: path
        name: listId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
          description: The list
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such list or no member; code LIST_NOT_FOUND, the same answer\
            \ for both"
      summary: One list of the logged-in person
      tags:
      - lists
    patch:
      operationId: renameList
      parameters:
      - in: path
        name: listId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameListRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
          description: The renamed list
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid name; code VALIDATION_FAILED with errors[].code NAME_REQUIRED\
            \ or NAME_TOO_LONG"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such list or no member; code LIST_NOT_FOUND, the same answer\
            \ for both"
      summary: Rename a list; the new name is visible to all members
      tags:
      - lists
  /api/v1/lists/{listId}/items:
    get:
      operationId: listItems
      parameters:
      - in: path
        name: listId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemsResponse"
          description: "The items, oldest first (BR-09), at most 500"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such list or no member; code LIST_NOT_FOUND, the same answer\
            \ for both"
      summary: The items of a list
      tags:
      - items
    post:
      operationId: addItem
      parameters:
      - in: path
        name: listId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddItemRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
          description: The new item; Location points to it
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid text; code VALIDATION_FAILED with errors[].code TEXT_REQUIRED\
            \ or TEXT_TOO_LONG"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such list or no member; code LIST_NOT_FOUND
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 500 items reached (BR-12); code ITEM_LIMIT_REACHED
      summary: Add an item at the end of the open items
      tags:
      - items
  /api/v1/lists/{listId}/items/clear-checked:
    post:
      operationId: clearCheckedItems
      parameters:
      - in: path
        name: listId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearCheckedRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearCheckedResponse"
          description: Number of items removed; only ids that are still checked are
            deleted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: More than 500 ids; code VALIDATION_FAILED
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such list or no member; code LIST_NOT_FOUND
      summary: Delete the given items that are still checked
      tags:
      - items
  /api/v1/lists/{listId}/items/{itemId}:
    delete:
      operationId: deleteItem
      parameters:
      - in: path
        name: listId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: itemId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such list or no member; code LIST_NOT_FOUND
      summary: Delete an item without confirmation (BR-11); an already deleted item
        answers 204
      tags:
      - items
    patch:
      operationId: updateItem
      parameters:
      - in: path
        name: listId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: itemId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
          description: "The item after the change (last write wins, ADR 0007)"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Neither text nor done, or invalid text; code VALIDATION_FAILED"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such list, no member or no such item; code LIST_NOT_FOUND\
            \ or ITEM_NOT_FOUND"
      summary: Set the text and/or the done state of an item
      tags:
      - items
  /api/v1/lists/{listId}/members/me:
    delete:
      operationId: leaveList
      parameters:
      - in: path
        name: listId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Left
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such list or no member; code LIST_NOT_FOUND, the same answer\
            \ for both"
      summary: Leave a list; the last member leaving deletes it
      tags:
      - lists
  /api/v1/lists/{listId}/share-link:
    get:
      operationId: getShareLink
      parameters:
      - in: path
        name: listId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
          description: The current link of the list
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such list or no member; code LIST_NOT_FOUND, the same answer\
            \ for both"
      summary: The share link of a list (members only)
      tags:
      - sharing
  /api/v1/lists/{listId}/share-link/renew:
    post:
      operationId: renewShareLink
      parameters:
      - in: path
        name: listId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
          description: The new link; the previous one is invalid from now on
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such list or no member; code LIST_NOT_FOUND, the same answer\
            \ for both"
      summary: Replaces the share link of a list (FR-SHARE-02); memberships stay
      tags:
      - sharing
  /api/v1/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
          description: The logged-in person
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
      summary: Profile of the logged-in person
      tags:
      - me-controller
  /api/v1/memberships/join:
    post:
      operationId: joinList
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinListRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinListResponse"
          description: "Joined, or already a member (alreadyMember true, no duplicate)"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No session; code UNAUTHENTICATED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unknown or renewed link, or no token at all; code SHARE_LINK_INVALID"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Member limit (50) or list limit (100) reached; code MEMBER_LIMIT_REACHED
            or LIST_LIMIT_REACHED
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many requests; code RATE_LIMITED
      summary: Joins the list behind a share token (body) or behind the token remembered
        in the session (empty body)
      tags:
      - sharing
components:
  schemas:
    AddItemRequest:
      type: object
      properties:
        text:
          type: string
          example: Milch
          maxLength: 200
          minLength: 1
      required:
      - text
    ClearCheckedRequest:
      type: object
      properties:
        itemIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 500
      required:
      - itemIds
    ClearCheckedResponse:
      type: object
      properties:
        removed:
          type: integer
          format: int32
          minimum: 0
      required:
      - removed
    CreateListRequest:
      type: object
      properties:
        name:
          type: string
          example: Wocheneinkauf
          maxLength: 80
          minLength: 1
      required:
      - name
    CurrentUserResponse:
      type: object
      properties:
        displayName:
          type: string
          example: Alex Beispiel
        email:
          type: string
          example: alex@beispiel.de
        id:
          type: string
          format: uuid
      required:
      - displayName
      - email
      - id
    InvitationResponse:
      type: object
      properties:
        listName:
          type: string
          maxLength: 80
      required:
      - listName
    ItemResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        done:
          type: boolean
        id:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 200
        version:
          type: integer
          format: int64
      required:
      - createdAt
      - done
      - id
      - text
      - version
    ItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemResponse"
          maxItems: 500
      required:
      - items
    JoinListRequest:
      type: object
      properties:
        token:
          type: string
          description: The share token; absent or empty means the one remembered in
            the session
          maxLength: 64
    JoinListResponse:
      type: object
      properties:
        alreadyMember:
          type: boolean
        listId:
          type: string
          format: uuid
        listName:
          type: string
          maxLength: 80
      required:
      - alreadyMember
      - listId
      - listName
    ListResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Wocheneinkauf
          maxLength: 80
        openCount:
          type: integer
          format: int32
          description: Number of items that are not checked yet
          minimum: 0
        revision:
          type: integer
          format: int64
          description: Changes whenever the list or one of its items changes
      required:
      - id
      - name
      - openCount
      - revision
    MyListsResponse:
      type: object
      properties:
        lists:
          type: array
          items:
            $ref: "#/components/schemas/ListResponse"
          maxItems: 100
      required:
      - lists
    ProblemDetail:
      type: object
      description: RFC 9457 problem details; code is stable (API-REST-07)
      properties:
        code:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
        instance:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        traceId:
          type: string
        type:
          type: string
      required:
      - code
      - status
    RenameListRequest:
      type: object
      properties:
        name:
          type: string
          example: WG-Vorrat
          maxLength: 80
          minLength: 1
      required:
      - name
    ShareLinkResponse:
      type: object
      properties:
        url:
          type: string
          description: "The complete link, <public base URL>/j/<token>"
          maxLength: 2048
      required:
      - url
    ShareTokenRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 64
          minLength: 1
      required:
      - token
    UpdateItemRequest:
      type: object
      description: At least one of text and done
      properties:
        done:
          type: boolean
        text:
          type: string
          maxLength: 200
          minLength: 1
