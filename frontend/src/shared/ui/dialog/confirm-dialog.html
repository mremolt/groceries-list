<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p [id]="descriptionId" class="text">{{ data.text }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" [mat-dialog-close]="false" cdkFocusInitial>{{ data.cancelLabel }}</button>
  <button matButton="filled" type="button" [mat-dialog-close]="true" [class.destructive]="data.destructive">
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
